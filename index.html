<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · QuriOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf9f6; --fg:#1c1b19; --muted:#6f6b63; --border:#e4e0d8; --card:#fff; --accent:#5b7f6a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif; padding:24px 16px; }
  .box { width:100%; max-width:360px; }
  h1 { font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; font-size:36px; text-align:center; margin:0 0 6px; }
  p.sub { text-align:center; color:var(--muted); font-size:14px; margin:0 0 28px; }
  input { width:100%; border:1px solid var(--border); background:var(--card); border-radius:12px; padding:11px 14px; font:inherit; font-size:15px; margin-bottom:10px; }
  input:focus { outline:none; border-color:#bdb7ab; }
  button { width:100%; border:0; border-radius:12px; padding:12px; background:var(--fg); color:#fff; font:inherit; font-weight:600; font-size:15px; cursor:pointer; }
  .err { color:#b4432f; font-size:13px; text-align:center; margin-bottom:12px; }
  .hint { margin-top:22px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<form class="box" method="post" action="/login">
  <h1>QuriOS</h1>
  <p class="sub">Parent portal · sign in</p>
  <div id="err" class="err" hidden>That email and password don't match.</div>
  <input name="email" type="email" placeholder="you@example.com" autocomplete="email" required autofocus>
  <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <div class="hint">Demo account · sample data only</div>
</form>
<script>if (location.search.indexOf('error=1') !== -1) document.getElementById('err').hidden = false;</script>
</body>
</html>
